# Default values for CloudForge Helm Chart

global:
  environment: production
  domain: cloudforge.local

# Frontend Service Configuration
frontend:
  replicaCount: 2
  image:
    repository: gcr.io/cloudforge-project/cloudforge-frontend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

# Backend API Service Configuration
backend:
  replicaCount: 2
  image:
    repository: gcr.io/cloudforge-project/cloudforge-backend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 5000
    targetPort: 5000
  env:
    nodeEnv: production
    port: 5000
    dbHost: cloudforge-postgres-service
    dbPort: "5432"
    dbName: cloudforge
    corsOrigin: "*"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  livenessProbe:
    httpGet:
      path: /api/health
      port: 5000
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /api/health
      port: 5000
    initialDelaySeconds: 10
    periodSeconds: 5
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75

# Database Secret Configuration
database:
  secretName: cloudforge-db-secret
  username: cloudforge_user
  password: SuperSecurePassword123!
  database: cloudforge
  jwtSecret: SuperSecretJwtKey2026ChangeMe!

# Ingress Route Configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: cloudforge.example.com
      paths:
        - path: /api
          pathType: Prefix
          serviceName: backend
          servicePort: 5000
        - path: /
          pathType: Prefix
          serviceName: frontend
          servicePort: 80
  tls:
    - secretName: cloudforge-tls
      hosts:
        - cloudforge.example.com
