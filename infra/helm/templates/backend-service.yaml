apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudforge.fullname" . }}-backend
  labels:
    {{- include "cloudforge.labels" . | nindent 4 }}
    component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "cloudforge.backend.selectorLabels" . | nindent 4 }}
