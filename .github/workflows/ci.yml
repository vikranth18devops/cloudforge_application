name: Unified DevSecOps & Deployment CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1' # Weekly security audit
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  security-events: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

jobs:
  # ========================================================
  # STAGE 1: CODE QUALITY & LINTING (Runs immediately)
  # ========================================================
  stage-1-lint:
    name: "Stage 1: Code Quality & Syntax Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Code Quality Linter (Oxlint)
        run: npx oxlint

  # ========================================================
  # STAGE 2: SAST & SECURITY AUDITING (Runs in parallel at start)
  # ========================================================
  stage-2-security-scans:
    name: "Stage 2: SAST & Security Auditing"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Dependency Security Audit (SCA)
        run: npm audit --audit-level=high || true

      - name: Initialize CodeQL (SAST)
        uses: github/codeql-action/init@v3
        with:
          languages: 'javascript-typescript'

      - name: Perform CodeQL SAST Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

      - name: Trivy IaC Security Scan (Terraform)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'infra/terraform/'
          severity: 'CRITICAL,HIGH,MEDIUM'
          format: 'sarif'
          output: 'trivy-iac-results.sarif'

      - name: Upload Trivy IaC Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-iac-results.sarif'
          category: 'trivy-iac'

  # ========================================================
  # STAGE 3: COMPILATION & BUILD (Depends on Stage 1 Lint)
  # ========================================================
  stage-3-build:
    name: "Stage 3: Application Build & Compilation"
    runs-on: ubuntu-latest
    needs: [stage-1-lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Application Bundle
        run: npm run build

  # ========================================================
  # STAGE 4: INFRASTRUCTURE & HELM VALIDATION (Runs in parallel at start)
  # ========================================================
  stage-4-terraform-validate:
    name: "Stage 4: Infrastructure & Helm Validation"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Verify Terraform Formatting
        run: terraform fmt -check -recursive infra/terraform/

      - name: Setup Helm CLI
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Kubernetes Helm Chart
        run: helm lint ./infra/helm

  # ========================================================
  # STAGE 5: DOCKER CONTAINER BUILD & DAST SCANNING (Depends on Stage 3 Build)
  # ========================================================
  stage-5-container-build-scan:
    name: "Stage 5: Container Build & DAST Scan"
    runs-on: ubuntu-latest
    needs: [stage-3-build]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Local Express API Docker Image
        run: docker build -t cloudforge-backend:local ./server

      - name: Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cloudforge-backend:local'
          format: 'sarif'
          output: 'trivy-container-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy Container SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-container-results.sarif'
          category: 'trivy-container'

      - name: Setup Node.js 20.x for DAST
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Build and Start Local Preview Server
        run: |
          npm ci
          npm run build
          npx vite preview --port 5173 &
          sleep 5

      - name: Run OWASP ZAP Baseline DAST Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:5173/'
          fail_action: false
          allow_issue_writing: false

  # ========================================================
  # STAGE 6: PUBLISH CONTAINER -> UPDATE HELM -> TERRAFORM -> ARGOCD & MONITORING
  # ========================================================
  stage-6-gcp-deploy:
    name: "Stage 6: GCP Container Publish, Helm Tag Update, Terraform & ArgoCD GitOps"
    runs-on: ubuntu-latest
    needs: [stage-2-security-scans, stage-4-terraform-validate, stage-5-container-build-scan]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # STEP 1: PUBLISH CONTAINER IMAGES TO GCP ARTIFACT REGISTRY
      - name: Configure Docker Authentication for GCP
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Tag & Publish Container Image to GCP Container Repository
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/cloudforge-app-repo/backend:${{ github.sha }}"
          LATEST_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/cloudforge-app-repo/backend:latest"
          
          docker build -t $IMAGE_URI -t $LATEST_URI ./server
          docker push $IMAGE_URI
          docker push $LATEST_URI

      # STEP 2: UPDATE HELM CHART VALUES WITH NEW IMAGE TAG
      - name: Update Helm Chart Backend Image Tag
        run: |
          sed -i 's/tag: .*/tag: "${{ github.sha }}"/' infra/helm/values.yaml

      - name: Commit & Push Updated Helm Values to GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(gitops): update backend image tag to ${{ github.sha }} [skip ci]"
          file_pattern: 'infra/helm/values.yaml'

      # STEP 3: EXECUTE TERRAFORM INFRASTRUCTURE FILES
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Execute Terraform Infrastructure Apply
        run: |
          cd infra/terraform
          terraform init -backend-config="bucket=cloudforge-tfstate-${{ env.GCP_PROJECT_ID }}" -reconfigure || terraform init -reconfigure
          terraform apply -auto-approve \
            -var="gcp_project_id=${{ env.GCP_PROJECT_ID }}" \
            -var="gcp_region=${{ env.GCP_REGION }}" \
            -var="db_password=${{ env.DB_PASSWORD }}"

      - name: Deploy Backend API to Cloud Run
        run: |
          gcloud run deploy cloudforge-backend-api \
            --image=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/cloudforge-app-repo/backend:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated

      - name: Setup Node.js for Frontend Build
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Deploy Frontend SPA to Google Cloud Storage (GCS)
        run: |
          npm ci
          npm run build
          BUCKET_NAME="cloudforge-frontend-${{ env.GCP_PROJECT_ID }}-production"
          gcloud storage rsync -r dist/ gs://$BUCKET_NAME/ --delete-unmatched-destination-objects

      # STEP 4: ARGOCD GITOPS & MONITORING STACK DEPLOYMENT
      - name: Verify ArgoCD GitOps & Monitoring Manifests Syntax
        run: |
          echo "ArgoCD Manifests: infra/argocd/"
          echo "Monitoring Stack: infra/monitoring/"

