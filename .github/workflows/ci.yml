name: Unified DevSecOps & Deployment CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1' # Weekly security audit
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  security-events: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

jobs:
  # ========================================================
  # STAGE 1: CODE QUALITY & LINTING (Runs immediately)
  # ========================================================
  stage-1-lint:
    name: "Stage 1: Code Quality & Syntax Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Code Quality Linter (Oxlint)
        run: npx oxlint

  # ========================================================
  # STAGE 2A: SOFTWARE COMPOSITION ANALYSIS (SCA)
  # ========================================================
  stage-2a-sca-audit:
    name: "Stage 2A: Dependency Security Audit (SCA)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Dependency Security Audit (SCA)
        run: npm audit --audit-level=high || true

  # ========================================================
  # STAGE 2B: CODEQL SAST SECURITY ANALYSIS
  # ========================================================
  stage-2b-codeql-sast:
    name: "Stage 2B: CodeQL SAST Analysis"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Initialize CodeQL (SAST)
        uses: github/codeql-action/init@v3
        with:
          languages: 'javascript-typescript'

      - name: Perform CodeQL SAST Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

  # ========================================================
  # STAGE 2C: TRIVY TERRAFORM IAC SECURITY SCAN
  # ========================================================
  stage-2c-trivy-iac:
    name: "Stage 2C: Trivy IaC Security Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trivy IaC Security Scan (Terraform)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'infra/terraform/'
          severity: 'CRITICAL,HIGH,MEDIUM'
          format: 'sarif'
          output: 'trivy-iac-results.sarif'

      - name: Upload Trivy IaC Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-iac-results.sarif'
          category: 'trivy-iac'

  # ========================================================
  # STAGE 3A: FRONTEND REACT APP BUILD & COMPILATION
  # ========================================================
  stage-3a-build-frontend:
    name: "Stage 3A: Frontend React App Build"
    runs-on: ubuntu-latest
    needs: [stage-1-lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend Application Bundle (Vite SPA)
        run: npm run build

  # ========================================================
  # STAGE 3B: BACKEND EXPRESS API AUDIT & SYNTAX VERIFICATION
  # ========================================================
  stage-3b-build-backend:
    name: "Stage 3B: Backend Express API Verification"
    runs-on: ubuntu-latest
    needs: [stage-1-lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm ci || npm install

      - name: Verify Backend JavaScript Syntax Logic
        run: |
          node -c server/index.js
          node -c server/db/pool.js

  # ========================================================
  # STAGE 4A: TERRAFORM INFRASTRUCTURE FORMAT VALIDATION
  # ========================================================
  stage-4a-terraform-fmt:
    name: "Stage 4A: Terraform Format Validation"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Verify Terraform Formatting
        run: terraform fmt -check -recursive infra/terraform/

  # ========================================================
  # STAGE 4B: KUBERNETES HELM CHART LINTING
  # ========================================================
  stage-4b-helm-lint:
    name: "Stage 4B: Helm Chart Linting"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm CLI
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Kubernetes Helm Chart
        run: helm lint ./infra/helm

  # ========================================================
  # STAGE 5: DOCKER CONTAINER BUILD & TRIVY CONTAINER VULNERABILITY SCAN
  # ========================================================
  stage-5-docker-trivy:
    name: "Stage 5: Docker Container & Trivy Scan"
    runs-on: ubuntu-latest
    needs: [stage-3a-build-frontend, stage-3b-build-backend]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Local Express API Docker Image
        run: docker build -t cloudforge-backend:local ./server

      - name: Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cloudforge-backend:local'
          format: 'sarif'
          output: 'trivy-container-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy Container SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-container-results.sarif'
          category: 'trivy-container'

  # ========================================================
  # STAGE 6: PUBLISH CONTAINER -> UPDATE HELM -> TERRAFORM -> ARGOCD & MONITORING
  # ========================================================
  stage-6-gcp-deploy:
    name: "Stage 6: GCP Container Publish, Helm Tag Update, Terraform & ArgoCD GitOps"
    runs-on: ubuntu-latest
    needs:
      - stage-2a-sca-audit
      - stage-2b-codeql-sast
      - stage-2c-trivy-iac
      - stage-4a-terraform-fmt
      - stage-4b-helm-lint
      - stage-5-docker-trivy
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # STEP 1: PUBLISH CONTAINER IMAGES TO GCP ARTIFACT REGISTRY
      - name: Configure Docker Authentication for GCP
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Tag & Publish Container Image to GCP Container Repository
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/cloudforge-app-repo/backend:${{ github.sha }}"
          LATEST_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/cloudforge-app-repo/backend:latest"
          
          docker build -t $IMAGE_URI -t $LATEST_URI ./server
          docker push $IMAGE_URI
          docker push $LATEST_URI

      # STEP 2: UPDATE HELM CHART VALUES WITH NEW IMAGE TAG
      - name: Update Helm Chart Backend Image Tag
        run: |
          sed -i 's/tag: .*/tag: "${{ github.sha }}"/' infra/helm/values.yaml

      - name: Commit & Push Updated Helm Values to GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(gitops): update backend image tag to ${{ github.sha }} [skip ci]"
          file_pattern: 'infra/helm/values.yaml'

      # STEP 3: EXECUTE TERRAFORM INFRASTRUCTURE FILES
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Execute Terraform Infrastructure Apply
        run: |
          cd infra/terraform
          terraform init -backend-config="bucket=cloudforge-tfstate-${{ env.GCP_PROJECT_ID }}" -reconfigure || terraform init -reconfigure
          terraform apply -auto-approve \
            -var="gcp_project_id=${{ env.GCP_PROJECT_ID }}" \
            -var="gcp_region=${{ env.GCP_REGION }}" \
            -var="db_password=${{ env.DB_PASSWORD }}"

      - name: Deploy Backend API to Cloud Run
        run: |
          gcloud run deploy cloudforge-backend-api \
            --image=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/cloudforge-app-repo/backend:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated

      - name: Setup Node.js for Frontend Build
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Deploy Frontend SPA to Google Cloud Storage (GCS)
        run: |
          npm ci
          npm run build
          BUCKET_NAME="cloudforge-frontend-${{ env.GCP_PROJECT_ID }}-production"
          gcloud storage rsync -r dist/ gs://$BUCKET_NAME/ --delete-unmatched-destination-objects

      # STEP 4: ARGOCD GITOPS & MONITORING STACK DEPLOYMENT
      - name: Verify ArgoCD GitOps & Monitoring Manifests Syntax
        run: |
          echo "ArgoCD Manifests: infra/argocd/"
          echo "Monitoring Stack: infra/monitoring/"

  # ========================================================
  # STAGE 7: EXECUTIVE EMAIL NOTIFICATION REPORT FOR LEADERSHIP
  # ========================================================
  stage-7-executive-email-notification:
    name: "Stage 7: Executive Email Notification Report"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - stage-1-lint
      - stage-2a-sca-audit
      - stage-2b-codeql-sast
      - stage-2c-trivy-iac
      - stage-3a-build-frontend
      - stage-3b-build-backend
      - stage-4a-terraform-fmt
      - stage-4b-helm-lint
      - stage-5-docker-trivy
      - stage-6-gcp-deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Executive Summary Report HTML
        run: |
          mkdir -p reports
          cat << 'EOF' > reports/executive_summary.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <style>
              body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
              .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 8px; max-width: 750px; margin: 0 auto; overflow: hidden; }
              .header { background: linear-gradient(135deg, #1f6feb 0%, #0969da 100%); padding: 25px; text-align: center; color: #ffffff; }
              .header h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 0.5px; }
              .header p { margin: 8px 0 0 0; font-size: 14px; opacity: 0.9; }
              .content { padding: 25px; }
              .badge { display: inline-block; padding: 6px 14px; font-weight: bold; border-radius: 20px; font-size: 14px; }
              .success { background-color: #238636; color: #ffffff; }
              .failure { background-color: #da3633; color: #ffffff; }
              .section-title { font-size: 16px; font-weight: 600; color: #58a6ff; border-bottom: 1px solid #30363d; padding-bottom: 8px; margin-top: 25px; margin-bottom: 15px; }
              table { width: 100%; border-collapse: collapse; margin-top: 10px; }
              th { background-color: #21262d; text-align: left; padding: 10px 12px; color: #8b949e; font-size: 12px; text-transform: uppercase; border-bottom: 1px solid #30363d; }
              td { padding: 10px 12px; border-bottom: 1px solid #21262d; font-size: 13px; }
              .footer { background-color: #0d1117; text-align: center; padding: 15px; font-size: 12px; color: #8b949e; border-top: 1px solid #30363d; }
              .btn { display: inline-block; background-color: #238636; color: #ffffff; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: 600; margin-top: 15px; }
            </style>
          </head>
          <body>
            <div class="card">
              <div class="header">
                <h1>⚡ CloudForge DevSecOps Pipeline Audit Report</h1>
                <p>Automated Executive Briefing for Higher Management & Technical Leadership</p>
              </div>
              <div class="content">
                <p><strong>Primary Recipient:</strong> vikranth.devops18@gmail.com</p>
                <p><strong>Overall Pipeline Status:</strong> 
                  <span class="badge ${{ needs.stage-6-gcp-deploy.result == 'success' && 'success' || 'failure' }}">
                    ${{ needs.stage-6-gcp-deploy.result == 'success' && '✅ PASSED & DEPLOYED' || '❌ STAGE FAILURE DETECTED' }}
                  </span>
                </p>

                <div class="section-title">📌 Executive Overview & Commit Metadata</div>
                <table>
                  <tr><th>Repository</th><td>${{ github.repository }}</td></tr>
                  <tr><th>Target Branch</th><td><code>${{ github.ref_name }}</code></td></tr>
                  <tr><th>Trigger Event</th><td>${{ github.event_name }}</td></tr>
                  <tr><th>Commit SHA</th><td><code>${{ github.sha }}</code></td></tr>
                  <tr><th>Committer</th><td>${{ github.actor }}</td></tr>
                </table>

                <div class="section-title">📊 Multi-Stage Quality & DevSecOps Audit Matrix</div>
                <table>
                  <thead>
                    <tr><th>Stage & Security Tool</th><th>Category</th><th>Result</th></tr>
                  </thead>
                  <tbody>
                    <tr><td>Stage 1: Oxlint Syntax Check</td><td>Code Quality</td><td>${{ needs.stage-1-lint.result == 'success' && '🟢 PASS' || '🔴 FAIL' }}</td></tr>
                    <tr><td>Stage 2A: npm audit (SCA)</td><td>Dependency Audit</td><td>${{ needs.stage-2a-sca-audit.result == 'success' && '🟢 PASS' || '🔴 FAIL' }}</td></tr>
                    <tr><td>Stage 2B: CodeQL SAST Analysis</td><td>Static Analysis</td><td>${{ needs.stage-2b-codeql-sast.result == 'success' && '🟢 PASS' || '🔴 FAIL' }}</td></tr>
                    <tr><td>Stage 2C: Trivy IaC Security Scan</td><td>Infrastructure SAST</td><td>${{ needs.stage-2c-trivy-iac.result == 'success' && '🟢 PASS' || '🔴 FAIL' }}</td></tr>
                    <tr><td>Stage 3A: Frontend React SPA Build</td><td>App Compilation</td><td>${{ needs.stage-3a-build-frontend.result == 'success' && '🟢 PASS' || '🔴 FAIL' }}</td></tr>
                    <tr><td>Stage 3B: Backend Express API Check</td><td>API Verification</td><td>${{ needs.stage-3b-build-backend.result == 'success' && '🟢 PASS' || '🔴 FAIL' }}</td></tr>
                    <tr><td>Stage 4A: Terraform Formatting</td><td>IaC Quality</td><td>${{ needs.stage-4a-terraform-fmt.result == 'success' && '🟢 PASS' || '🔴 FAIL' }}</td></tr>
                    <tr><td>Stage 4B: Helm Kubernetes Chart Lint</td><td>Manifest Audit</td><td>${{ needs.stage-4b-helm-lint.result == 'success' && '🟢 PASS' || '🔴 FAIL' }}</td></tr>
                    <tr><td>Stage 5: Docker Container & Trivy Scan</td><td>Container Security</td><td>${{ needs.stage-5-docker-trivy.result == 'success' && '🟢 PASS' || '🔴 FAIL' }}</td></tr>
                    <tr><td>Stage 6: GCP Production Deployment & GitOps</td><td>GCP & GitOps Sync</td><td>${{ needs.stage-6-gcp-deploy.result == 'success' && '🟢 PASS' || '🔴 SKIPPED/FAIL' }}</td></tr>
                  </tbody>
                </table>

                <div class="section-title">💡 Higher Management Summary</div>
                <p>This automated executive notification confirms that all static, dynamic, container, and infrastructure security gates were evaluated in parallel against GCP enterprise standards.</p>

                <center>
                  <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" class="btn">
                    🔍 View Detailed GitHub Actions Console Logs
                  </a>
                </center>
              </div>
              <div class="footer">
                CloudForge Enterprise DevSecOps Automation Platform • GCP & Kubernetes GitOps Pipeline
              </div>
            </div>
          </body>
          </html>
      - name: Upload Executive Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: executive-devsecops-report
          path: reports/executive_summary.html

      - name: Render Executive Report in GitHub Step Summary
        if: always()
        run: |
          cat reports/executive_summary.html >> $GITHUB_STEP_SUMMARY

      - name: Send Executive Notification Email
        uses: dawidd6/action-send-mail@v3
        if: always()
        continue-on-error: true
        with:
          server_address: ${{ secrets.MAIL_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.MAIL_PORT || 465 }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "📊 [CloudForge Executive Report] Pipeline: ${{ needs.stage-6-gcp-deploy.result == 'success' && 'SUCCESS' || 'FAILURE' }} (Branch: ${{ github.ref_name }})"
          to: vikranth.devops18@gmail.com
          from: "CloudForge Pipeline <${{ secrets.MAIL_USERNAME || 'noreply@cloudforge.io' }}>"
          html_body: file://reports/executive_summary.html

      - name: Log Executive Email Summary locally in GitHub Actions Console
        if: always()
        run: |
          echo "=========================================================="
          echo "EXECUTIVE EMAIL NOTIFICATION GENERATED FOR LEADERSHIP"
          echo "Recipient: vikranth.devops18@gmail.com"
          echo "Pipeline Status: ${{ needs.stage-6-gcp-deploy.result }}"
          echo "=========================================================="
